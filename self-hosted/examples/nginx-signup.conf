# Include inside Nginx's http context. Run Nginx on the Docker host.
# Requires Nginx 1.25.1+ with HTTP/2 and gRPC modules.
# Replace signup.example.org and provision the certificate before enabling
# the TLS server block. Keep signupd bound to 127.0.0.1:10322.
# .env: SIGNUP_PROTOCOL=https
#       SIGNUP_PUBLIC_URL=https://signup.example.org
#       SIGNUP_BIND_ADDRESS=127.0.0.1
# Obtain a certificate using your distribution's Certbot webroot setup:
#   certbot certonly --webroot -w /var/www/letsencrypt -d signup.example.org
# Enable its renewal timer and install a deploy hook running:
#   nginx -t && systemctl reload nginx
# See https://eff-certbot.readthedocs.io/en/stable/using.html#renewing-certificates
# Initially enable only the port 80 block, create /var/www/letsencrypt, and
# obtain the certificate. Then enable the port 443 block and reload Nginx.
server {
    listen 80;
    server_name signup.example.org;
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name signup.example.org;
    ssl_certificate /etc/letsencrypt/live/signup.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/signup.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        grpc_pass grpc://127.0.0.1:10322;
        grpc_set_header Host $host;
        grpc_read_timeout 300s;
        grpc_send_timeout 300s;
    }
}
